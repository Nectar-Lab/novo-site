map $http_accept $home_ext {
    default "html";
    "~*text/markdown" "md";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Vary "Accept, Accept-Encoding" always;

    error_page 404 /404.$home_ext;
    location = /404.html {
        internal;
    }
    location = /404.md {
        internal;
        default_type "text/markdown; charset=utf-8";
    }

    location = /nginx.conf {
        return 404;
    }

    location = / {
        default_type "text/markdown; charset=utf-8";
        try_files /index.$home_ext =404;
    }
}
